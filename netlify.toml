# Netlify: connect the repo and these settings are picked up automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: serve index.html for client-side routes like /bills.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or updates would not reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
