# DigitalOcean App Platform, production: the web app and sync API in one container, in London.
# Create: doctl apps create --spec .do/app.yaml   Update: doctl apps update <app-id> --spec .do/app.yaml
# Every push to main deploys. See docs/SERVER.md for the one-time setup (database, secrets, domain).
name: mizan
region: lon

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: app
    github:
      repo: telberrak/personal-finance
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8787
    # Shared 1 vCPU, 512 MB, $5 a month. Next step up: apps-s-1vcpu-1gb-fixed ($10).
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 30
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: TEN_MINUTES
    envs:
      - key: LEDGER_ENV
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      # Passkeys and CORS follow the app's address (the custom domain once one is added).
      - key: RP_ID
        scope: RUN_TIME
        value: ${APP_DOMAIN}
      - key: APP_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL},capacitor://localhost,https://localhost
      # Set these in the dashboard (Settings → App-level environment variables), encrypted.
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_FROM
        scope: RUN_TIME
      - key: VAPID_PRIVATE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: VAPID_PUBLIC_KEY
        scope: RUN_TIME
      - key: VAPID_SUBJECT
        scope: RUN_TIME
      # Shown in the privacy policy, terms and help; baked into the web app at build time.
      - key: VITE_SUPPORT_EMAIL
        scope: BUILD_TIME
      - key: VITE_OPERATOR_NAME
        scope: BUILD_TIME

ingress:
  rules:
    - component:
        name: app
      match:
        path:
          prefix: /

databases:
  # The managed PostgreSQL cluster (create it first, in London). Other projects can use the same
  # cluster with their own database and user.
  - name: db
    engine: PG
    production: true
    cluster_name: mizan-db
    db_name: mizan
    db_user: mizan
