# DigitalOcean App Platform, production: the web app and sync API in one container, in London.
# Deployed by GitHub Actions (.github/workflows/ci.yml) after every test passes on main: the first
# run creates the app, later runs update it. ${NAME} values are filled in from GitHub secrets and
# variables at deploy time; ${APP_URL}, ${APP_DOMAIN} and ${db.*} are filled in by DigitalOcean.
# Setup: docs/DEPLOY.md.
name: mizan
region: lon

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: app
    github:
      repo: telberrak/personal-finance
      branch: main
      # GitHub Actions deploys once the tests pass, so pushes alone do not.
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8787
    # Shared 1 vCPU, 512 MB, $5 a month. Next step up: apps-s-1vcpu-1gb-fixed ($10).
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 30
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: TEN_MINUTES
    envs:
      - key: LEDGER_ENV
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      # Passkeys and CORS follow the app's address (the custom domain once one is added).
      - key: RP_ID
        scope: RUN_TIME
        value: ${APP_DOMAIN}
      - key: APP_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL},capacitor://localhost,https://localhost
      # From GitHub (Settings → Secrets and variables → Actions). The app spec is replaced on every
      # deploy, so set them there, not in the DigitalOcean dashboard.
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${RESEND_API_KEY}
      - key: MAIL_FROM
        scope: RUN_TIME
        value: ${MAIL_FROM}
      # Shown in the privacy policy, terms and help; baked into the web app at build time.
      - key: VITE_SUPPORT_EMAIL
        scope: BUILD_TIME
        value: ${VITE_SUPPORT_EMAIL}
      - key: VITE_OPERATOR_NAME
        scope: BUILD_TIME
        value: ${VITE_OPERATOR_NAME}

# Your domain (see docs/DEPLOY.md). Passkeys and CORS follow the primary domain.
# domains:
#   - domain: mizan.example.com
#     type: PRIMARY

ingress:
  rules:
    - component:
        name: app
      match:
        path:
          prefix: /

databases:
  # The managed PostgreSQL cluster (create it first, in London). Other projects can use the same
  # cluster with their own database and user.
  - name: db
    engine: PG
    production: true
    cluster_name: mizan-db
    db_name: mizan
    db_user: mizan
